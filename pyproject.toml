[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptivehmmc"
version = "0.2.0"
description = "Adaptive-grid moment-conserving sectional solver for population balance equations with coalescence, breakage, and proportional growth."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Mahdi Mousavi" },
    { name = "Ville Alopaeus" },
]
keywords = [
    "population-balance",
    "adaptive-grid",
    "HMMC",
    "coalescence",
    "breakage",
    "growth",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.5"]
test = ["pytest>=7"]
dev = ["matplotlib>=3.5", "pytest>=7"]

[project.urls]
Homepage = "https://github.com/SamMousaviES/adaptive-grid-pbm-hmmc"
Issues = "https://github.com/SamMousaviES/adaptive-grid-pbm-hmmc/issues"

[tool.setuptools.packages.find]
where = ["src"]
